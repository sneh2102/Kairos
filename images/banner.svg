<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1115"/>
      <stop offset="1" stop-color="#1b2230"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ac4d0"/>
      <stop offset="1" stop-color="#6b7cff"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="20" fill="url(#bg)"/>

  <!-- pipeline motif: scrape -> screen -> build -> apply -->
  <g stroke="#2c3646" stroke-width="2" fill="none">
    <path d="M820 160 H1180"/>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9aa4b2" text-anchor="middle">
    <circle cx="840" cy="160" r="26" fill="#161b24" stroke="#8ac4d0" stroke-width="2"/>
    <text x="840" y="215">Scrape</text>
    <circle cx="950" cy="160" r="26" fill="#161b24" stroke="#7fb0e0" stroke-width="2"/>
    <text x="950" y="215">Screen</text>
    <circle cx="1060" cy="160" r="26" fill="#161b24" stroke="#7493f0" stroke-width="2"/>
    <text x="1060" y="215">Build</text>
    <circle cx="1170" cy="160" r="26" fill="#161b24" stroke="#6b7cff" stroke-width="2"/>
    <text x="1170" y="215">Interview</text>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#e6e9ee" text-anchor="middle">
    <text x="840" y="166">1</text>
    <text x="950" y="166">2</text>
    <text x="1060" y="166">3</text>
    <text x="1170" y="166">4</text>
  </g>

  <text x="80" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="700" fill="#f2f4f7">Kairos</text>
  <rect x="84" y="172" width="120" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="80" y="220" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#c3cad5">Job search pipeline</text>
  <text x="80" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#7d8796">Scraping, screening, tailored resumes and interview practice</text>
</svg>
